[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = tests/features
markers =
    tnr: Deterministic non-regression tests (run on every PR, zero live API calls)
    llm_eval: Live LiteLLM golden-dataset evaluation (run only on prompt/model changes)
    feed_canary: Live feed reachability check (run on weekly schedule)
