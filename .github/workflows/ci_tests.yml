name: CI Non-Regression Suite (TNR)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-bdd-tnr:
    name: Python Pipeline BDD TNR ($0 offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      - name: Install pipeline & test dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Python dependency vulnerability audit (ANSSI / OWASP A06)
        run: pip-audit -r requirements.txt

      - name: Run deterministic BDD TNR (pytest-bdd)
        run: pytest -m tnr -v

  web-e2e-tnr:
    name: Next.js Typecheck, Audit, Build & Playwright E2E TNR ($0 offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies (npm ci)
        run: npm ci

      - name: Node.js production dependency audit (ANSSI / OWASP A06)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E TNR against offline mock Supabase
        run: npm run test:e2e
