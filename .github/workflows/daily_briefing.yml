name: Daily Cybersecurity Briefing

on:
  schedule:
    # 07:00 CET (UTC+1) = 06:00 UTC daily (runs at 08:00 CEST during summer time)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      manual_urls:
        description: "Optional comma or newline-separated HTTPS article URLs to ingest"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate ingestion & LLM output without writing to Supabase"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Prevent overlapping scheduled and manual runs from racing on the same cluster writes
concurrency:
  group: daily-cybersecurity-briefing
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 25 min cap protects GitHub Actions free-tier minutes if a feed hangs or LLM retries spike
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install --no-cache-dir -r pipeline/requirements.txt

      - name: Execute ingestion, clustering & synthesis pipeline
        env:
          # Required Secrets (GitHub Settings -> Secrets and variables -> Actions -> Secrets)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional Phase 2 Alert Secrets (leave blank if alerts are unused)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          # Optional Repository Variables (override without editing code)
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL || 'CrossRead Alerts <onboarding@resend.dev>' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || '' }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED || 'true' }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL || 'gemini/gemini-3.5-flash-lite' }}
          SYNTHESIS_MODEL: ${{ vars.SYNTHESIS_MODEL || 'gemini/gemini-3.8-flash' }}
          LLM_THROTTLE_SECONDS: ${{ vars.LLM_THROTTLE_SECONDS || '4.5' }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '2048' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '40' }}
          MANUAL_URLS: ${{ inputs.manual_urls || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python pipeline/main.py --dry-run
          else
            python pipeline/main.py
          fi

      - name: Record failure notice in workflow summary
        if: failure()
        run: |
          {
            echo "### Daily Cybersecurity Briefing Failed"
            echo "- Inspect the pipeline step logs above for SSRF blocks, API quota errors (429), or Supabase write errors."
            echo "- Check \`public.alert_logs\` and \`public.admin_audit_logs\` in Supabase if alerts failed."
          } >> "$GITHUB_STEP_SUMMARY"
